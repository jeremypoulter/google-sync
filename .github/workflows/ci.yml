name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs of the same branch or PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: go vet (linux and windows)
        run: |
          go vet ./...
          GOOS=windows go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # gotestsum is a `tool` in go.mod, so Dependabot keeps it up to date.
      - name: go test
        shell: bash
        run: |
          mkdir -p test-results
          go tool gotestsum \
            --format testdox \
            --junitfile "test-results/${{ matrix.os }}.xml" \
            -- -count=1 -coverprofile="test-results/${{ matrix.os }}.cover" ./...
      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          if [ -f "test-results/${{ matrix.os }}.cover" ]; then
            {
              echo "### Coverage (${{ matrix.os }})"
              echo '```'
              go tool cover -func="test-results/${{ matrix.os }}.cover" | tail -1
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          retention-days: 14

  # Posts the results as a PR comment and check run. Skipped on fork PRs,
  # where the token is read-only.
  test-report:
    name: Test report
    needs: test
    if: >-
      always() && needs.test.result != 'skipped' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-*
          path: test-results
      - uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2.26.0
        with:
          files: test-results/**/*.xml
          check_name: Test results
          comment_mode: always
          compare_to_earlier_commit: true

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: linux, goarch: amd64, ext: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # No OAuth client is embedded in CI builds; sign-in needs --client-file.
      - name: go build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: >-
          go build -trimpath
          -ldflags "-s -w -X github.com/jeremypoulter/google-sync/internal/config.Version=${GITHUB_SHA::7}"
          -o "dist/gmigrate-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          ./cmd/gmigrate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gmigrate-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 14
