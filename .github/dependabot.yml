version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      google-apis:
        patterns:
          - "google.golang.org/*"
          - "cloud.google.com/*"
          - "golang.org/x/oauth2"
      golang-x:
        patterns:
          - "golang.org/x/*"
        exclude-patterns:
          - "golang.org/x/oauth2"
      go-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
